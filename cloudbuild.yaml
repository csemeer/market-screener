# Google Cloud Build Configuration
# Builds and deploys both frontend and backend to Cloud Run

steps:
  # ========================================
  # STEP 1: Build Backend Docker Image
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/market-screener-backend:${_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/market-screener-backend:latest'
      - '-f'
      - './backend/Dockerfile'
      - './backend'
    dir: '.'

  # ========================================
  # STEP 2: Push Backend Image to GCR
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/market-screener-backend:${_TAG}'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/market-screener-backend:latest'
    waitFor: ['build-backend']

  # ========================================
  # STEP 3: Build Frontend Docker Image
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/market-screener-frontend:${_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/market-screener-frontend:latest'
      - '-f'
      - './frontend/Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=https://market-screener-backend-156258219586.${_REGION}.run.app/api'
      - './frontend'
    dir: '.'

  # ========================================
  # STEP 4: Push Frontend Image to GCR
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/market-screener-frontend:${_TAG}'
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/market-screener-frontend:latest'
    waitFor: ['build-frontend']

  # ========================================
  # STEP 5: Deploy Backend to Cloud Run
  # ========================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-backend'
    args:
      - 'run'
      - 'deploy'
      - 'market-screener-backend'
      - '--image=gcr.io/$PROJECT_ID/market-screener-backend:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--port=3001'
      - '--set-env-vars=NODE_ENV=production'
    waitFor: ['push-backend', 'push-backend-latest']

  # ========================================
  # STEP 6: Deploy Frontend to Cloud Run
  # ========================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-frontend'
    args:
      - 'run'
      - 'deploy'
      - 'market-screener-frontend'
      - '--image=gcr.io/$PROJECT_ID/market-screener-frontend:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--port=8080'
    waitFor: ['push-frontend', 'push-frontend-latest', 'deploy-backend']

# ========================================
# Image Storage
# ========================================
images:
  - 'gcr.io/$PROJECT_ID/market-screener-backend:${_TAG}'
  - 'gcr.io/$PROJECT_ID/market-screener-backend:latest'
  - 'gcr.io/$PROJECT_ID/market-screener-frontend:${_TAG}'
  - 'gcr.io/$PROJECT_ID/market-screener-frontend:latest'

# ========================================
# Build Options
# ========================================
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# ========================================
# Substitutions (Default Values)
# ========================================
substitutions:
  _REGION: 'us-central1'  # Change to your preferred region
  _TAG: 'latest'          # Image tag (use latest by default)

# ========================================
# Timeout
# ========================================
timeout: '1800s'  # 30 minutes
